# Netlify build configuration for bestlooking.skin
# Netlify deployment is DISABLED. The production site is built and published locally on the host.

[build]
  # When ignore command exits with 0, Netlify skips and cancels all builds from git
  ignore = "exit 0"
  command = "echo 'Netlify deployments are disabled. Site is published locally on the server.' && exit 1"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
