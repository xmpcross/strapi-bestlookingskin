# Netlify build for bestlooking.skin (Next.js 16, server-rendered). See NETLIFY.md before switching DNS.
# The production server (/opt/projects/bestlooking.skin, ./deploy.sh) does not read this file.
[build]
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and applies its Next.js runtime automatically (no plugin entry needed).

# Same cache policy nginx applies on the server.
[[headers]]
  for = "/cms-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The apex domain goes to www (nginx does this on the server). Set www.bestlooking.skin as the primary domain in
# Netlify as well; this rule covers requests that still reach the apex.
[[redirects]]
  from = "https://bestlooking.skin/*"
  to = "https://www.bestlooking.skin/:splat"
  status = 301
  force = true
